<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Вход • Страница клиента</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #fdf7f2;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
      transition: padding 0.3s ease;
    }
    body.fullscreen { padding: 0; overflow: hidden; }

    /* ==================== */
    /* КАРТОЧКА ЛОГИНА (без изменений) */
    /* ==================== */
    .login-card { background: white; max-width: 460px; width: 100%; margin: auto; border-radius: 32px; box-shadow: 0 20px 35px rgba(0,0,0,0.03); padding: 40px 34px 34px; display: flex; flex-direction: column; align-items: center; }
    .login-page { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .login-page.hidden { display: none; }
    .header-block { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; width: 100%; padding: 0 2px; }
    .title-col { display: flex; flex-direction: column; align-items: flex-start; }
    .title { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.5px; color: #2c2416; line-height: 1.1; }
    .subhead { font-size: 0.88rem; color: #a89880; margin-top: 3px; font-weight: 400; }
    .lang-dropdown { position: relative; user-select: none; z-index: 50; }
    .lang-dropdown-trigger { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #f5efe6; border: 1px solid #e2d5c3; border-radius: 12px; cursor: pointer; font-size: 0.75rem; font-weight: 700; color: #2c2416; }
    .lang-dropdown-trigger .chevron { width: 14px; height: 14px; transition: transform 0.3s ease; opacity: 0.6; }
    .lang-dropdown.open .chevron { transform: rotate(180deg); }
    .lang-dropdown-menu { position: absolute; top: calc(100% + 6px); right: 0; background: white; border: 1px solid #e8ddd0; border-radius: 14px; box-shadow: 0 12px 32px rgba(44,36,22,0.14); overflow: hidden; min-width: 100%; opacity: 0; transform: translateY(-8px) scale(0.96); pointer-events: none; transition: all 0.25s ease; }
    .lang-dropdown.open .lang-dropdown-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .lang-dropdown-option { display: block; width: 100%; padding: 10px 16px; font-size: 0.75rem; font-weight: 600; color: #8b7a62; background: transparent; border: none; cursor: pointer; text-align: left; }
    .lang-dropdown-option:hover { background: #faf4ec; color: #2c2416; }
    .lang-dropdown-option.active { color: #2c2416; font-weight: 700; background: #f5ede0; }
    .divider-line { width: 100%; border-bottom: 1px solid #f0e7db; margin: 16px 0 28px; }
    .client-form { width: 100%; display: flex; flex-direction: column; gap: 18px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #6b5e4a; margin-left: 6px; }
    .input-group input { background: #fefcf8; border: 1px solid #ede3d4; border-radius: 16px; padding: 16px 18px; font-size: 1rem; color: #2e271e; outline: none; }
    .input-group input:focus { border-color: #c8b294; background: #fff; box-shadow: 0 0 0 4px rgba(200,178,148,0.18); }
    .buttons-block { width: 100%; display: flex; flex-direction: column; gap: 12px; margin: 24px 0; }
    .button-primary { background: #2a2419; border: 1px solid #3b3324; border-radius: 18px; padding: 18px; font-weight: 600; font-size: 1rem; color: white; cursor: pointer; width: 100%; text-align: center; }
    .button-primary:hover { background: #3f3522; }
    .button-secondary { background: #e8e3da; border: 1px solid #d6cdbc; border-radius: 18px; padding: 15px; font-weight: 550; font-size: 0.95rem; color: #b0a590; cursor: not-allowed; width: 100%; text-align: center; opacity: 0.7; pointer-events: none; }
    .button-secondary.active { background: #fefcf9; color: #4a3f2e; cursor: pointer; opacity: 1; pointer-events: auto; }
    .button-secondary .lock-icon { margin-right: 4px; }
    .button-secondary.active .lock-icon { display: none; }
    .contact-footer { width: 100%; border-top: 1px solid #f1e7d9; padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .contact-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 20px; }
    .contact-item { display: flex; align-items: center; gap: 8px; color: #5f5340; font-size: 0.9rem; text-decoration: none; }
    .contact-item svg { width: 18px; height: 18px; stroke: #7b6e58; stroke-width: 1.8; fill: none; }
    .phone-number { font-weight: 600; background: #f7f0e4; padding: 6px 14px; border-radius: 30px; color: #2f2819; }
    .telegram-channel, .instagram-profile { background: #faf6ef; padding: 6px 16px; border-radius: 30px; color: #4e3f2c; }

    /* ==================== */
    /* ПРИМЕРНАЯ СТРАНИЦА */
    /* ==================== */
    .example-page { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background-color: #fdf7f2; z-index: 100; overflow-y: auto; overflow-x: hidden; }
    .example-page.hidden { display: none; }

    /* ЭТАП 1: Крупный текст по центру */
    .hero-text {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 10;
      pointer-events: none;
    }
    /* Перемещён вверх */
    .hero-text.moved {
      top: 40px; left: 36px;
      transform: translate(0, 0);
    }
    .hero-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #2c2416;
      transition: font-size 1s ease;
      white-space: nowrap;
    }
    .hero-text.moved .hero-title {
      font-size: 2.6rem;
    }
    .hero-subtitle {
      font-size: 1.3rem; color: #8b7a62; margin-top: 8px;
      transition: all 0.6s ease;
    }
    .hero-text.moved .hero-subtitle {
      opacity: 0; font-size: 0; margin-top: 0; height: 0; overflow: hidden;
    }

    /* ЭТАП 2: Контент под заголовком */
    .example-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; min-height: 100vh;
      padding: 140px 36px 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
    }
    .example-container.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Десктопный nav list */
    .nav-list-desktop {
      display: flex; flex-direction: column; gap: 2px;
      width: 100%; max-width: 360px;
    }
    .nav-item-desktop {
      display: block; padding: 12px 18px;
      font-size: 0.95rem; font-weight: 500; color: #5f5340;
      text-decoration: none; border-radius: 10px; cursor: pointer;
      transition: all 0.3s ease;
    }
    .nav-item-desktop::before { content: '—'; margin-right: 12px; color: #c8b294; }
    .nav-item-desktop:hover { background: #faf6ef; color: #2c2416; padding-left: 24px; }
    .nav-item-desktop.active { background: #f5ede0; color: #2c2416; font-weight: 600; padding-left: 24px; }
    .nav-item-desktop.active::before { content: '◆'; color: #2a2419; font-size: 0.65rem; }
    .nav-divider { height: 1px; background: #e8ddd0; margin: 4px 0; width: 60%; }

    /* Анимация появления пунктов */
    .example-container.visible .nav-item-desktop:nth-child(1) { animation: fadeSlideRight 0.4s ease-out 0.3s both; }
    .example-container.visible .nav-item-desktop:nth-child(2) { animation: fadeSlideRight 0.4s ease-out 0.4s both; }
    .example-container.visible .nav-item-desktop:nth-child(3) { animation: fadeSlideRight 0.4s ease-out 0.45s both; }
    .example-container.visible .nav-item-desktop:nth-child(4) { animation: fadeSlideRight 0.4s ease-out 0.5s both; }
    .example-container.visible .nav-item-desktop:nth-child(5) { animation: fadeSlideRight 0.4s ease-out 0.55s both; }
    .example-container.visible .nav-item-desktop:nth-child(6) { animation: fadeSlideRight 0.4s ease-out 0.6s both; }
    .example-container.visible .nav-item-desktop:nth-child(7) { animation: fadeSlideRight 0.4s ease-out 0.65s both; }
    @keyframes fadeSlideRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

    /* Мобильный бургер */
    .burger-btn { display: none; }
    .side-panel { display: none; }
    .overlay { display: none; }

    /* АДАПТИВНОСТЬ */
    @media (max-width: 768px) {
      body { padding: 14px; }
      .login-card { padding: 28px 22px; }
      .title { font-size: 2rem; }
      .hero-text.moved { top: 28px; left: 20px; }
      .hero-text.moved .hero-title { font-size: 2rem; }
      .example-container { padding: 120px 24px 32px; }
      .nav-list-desktop { display: none; }

      .burger-btn {
        display: flex; position: fixed; top: 24px; right: 24px;
        width: 42px; height: 42px; background: white;
        border: 1px solid #e8ddd0; border-radius: 14px;
        flex-direction: column; align-items: center; justify-content: center; gap: 5px;
        cursor: pointer; z-index: 200;
      }
      .burger-btn span { width: 20px; height: 2px; background: #5f5340; border-radius: 2px; transition: 0.3s; }
      .burger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .burger-btn.open span:nth-child(2) { opacity: 0; }
      .burger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      .side-panel {
        display: flex; flex-direction: column;
        position: fixed; top: 0; right: -100%;
        width: 300px; max-width: 85vw; height: 100vh; height: 100dvh;
        background: white; z-index: 150;
        box-shadow: -8px 0 30px rgba(0,0,0,0.08);
        transition: right 0.4s ease; padding: 90px 24px 32px; overflow-y: auto;
      }
      .side-panel.open { right: 0; }
      .overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 140; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
      .overlay.visible { opacity: 1; pointer-events: auto; }
      .side-panel-title { font-size: 1.1rem; font-weight: 600; color: #2c2416; margin-bottom: 20px; }
      .side-nav-list { display: flex; flex-direction: column; gap: 4px; }
      .side-nav-item { padding: 14px 18px; font-size: 0.95rem; font-weight: 500; color: #5f5340; text-decoration: none; border-radius: 10px; cursor: pointer; }
      .side-nav-item::before { content: '—'; margin-right: 12px; color: #c8b294; }
      .side-nav-item.active { background: #f5ede0; color: #2c2416; font-weight: 600; }
      .side-nav-item.active::before { content: '◆'; color: #2a2419; font-size: 0.65rem; }
      .side-nav-divider { height: 1px; background: #e8ddd0; margin: 4px 0; }
    }

    @media (max-width: 480px) {
      .title { font-size: 1.6rem; }
      .hero-text.moved { top: 20px; left: 14px; }
      .hero-text.moved .hero-title { font-size: 1.5rem; }
      .example-container { padding: 100px 14px 20px; }
    }
  </style>
</head>
<body id="bodyElement">

  <!-- КАРТОЧКА ЛОГИНА -->
  <div class="login-card" id="loginCard">
    <div class="login-page" id="loginPage">
      <div class="header-block">
        <div class="title-col"><h1 class="title" id="pageTitle">Вход</h1><div class="subhead" id="pageSubhead">добро пожаловать</div></div>
        <div class="lang-dropdown" id="langDropdownLogin">
          <button class="lang-dropdown-trigger" id="langTriggerLogin"><span id="langLabelLogin">RUS</span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="lang-dropdown-menu" id="langMenuLogin">
            <button class="lang-dropdown-option" data-lang="uzb">UZB</button>
            <button class="lang-dropdown-option active" data-lang="rus">RUS</button>
            <button class="lang-dropdown-option" data-lang="eng">ENG</button>
          </div>
        </div>
      </div>
      <div class="divider-line"></div>
      <form class="client-form" id="clientForm">
        <div class="input-group"><label id="labelFirstname">Имя</label><input type="text" id="firstname" placeholder="Ваше имя" required></div>
        <div class="input-group"><label id="labelLastname">Фамилия</label><input type="text" id="lastname" placeholder="Ваша фамилия" required></div>
        <div class="input-group"><label id="labelPhone">Номер телефона</label><input type="tel" id="phone" placeholder="+998 00 000 00 00" required></div>
      </form>
      <div class="buttons-block">
        <button type="submit" form="clientForm" class="button-primary" id="submitBtn">Отправить информацию</button>
        <button type="button" class="button-secondary" id="goToExampleBtn" disabled><span class="lock-icon">🔒</span> <span id="exampleBtnText">Перейти в примерную</span></button>
      </div>
      <div class="contact-footer"><div class="contact-row">
        <a href="https://t.me/your_channel" class="telegram-channel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2.5L2.5 10.5L10.5 13.5L13.5 21.5L21.5 2.5Z"/><path d="M10.5 13.5L15.5 8.5"/></svg><span>Telegram канал</span></a>
        <a href="tel:+998946930002" class="contact-item phone-number"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>+998 (94) 693-00-02</a>
        <a href="https://instagram.com/your_profile" class="instagram-profile contact-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg><span>Instagram профиль</span></a>
      </div></div>
    </div>
  </div>

  <!-- ПРИМЕРНАЯ СТРАНИЦА -->
  <div class="example-page hidden" id="examplePage">
    
    <!-- ЭТАП 1: Текст по центру → вверх -->
    <div class="hero-text" id="heroText">
      <h1 class="hero-title" id="heroTitle">Примерная страница</h1>
      <p class="hero-subtitle" id="heroSubtitle">Добро пожаловать!</p>
    </div>

    <!-- ЭТАП 2: Nav list под заголовком (десктоп) -->
    <div class="example-container" id="exampleContainer">
      <div class="nav-list-desktop" id="navListDesktop">
        <a href="#" class="nav-item-desktop" data-category="rings">Кольца</a>
        <a href="#" class="nav-item-desktop" data-category="chains">Цепочки</a>
        <div class="nav-divider"></div>
        <a href="#" class="nav-item-desktop active" data-category="cartier">Cartier</a>
        <a href="#" class="nav-item-desktop" data-category="oneclif">One Clif</a>
        <div class="nav-divider"></div>
        <a href="#" class="nav-item-desktop" data-category="bracelets">Браслеты</a>
        <a href="#" class="nav-item-desktop" data-category="earrings">Серьги</a>
      </div>
    </div>

    <!-- БУРГЕР (мобильные) -->
    <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
    <div class="overlay" id="overlay"></div>
    <div class="side-panel" id="sidePanel">
      <p class="side-panel-title">Категории</p>
      <div class="side-nav-list" id="sideNavList">
        <a href="#" class="side-nav-item" data-category="rings">Кольца</a>
        <a href="#" class="side-nav-item" data-category="chains">Цепочки</a>
        <div class="side-nav-divider"></div>
        <a href="#" class="side-nav-item active" data-category="cartier">Cartier</a>
        <a href="#" class="side-nav-item" data-category="oneclif">One Clif</a>
        <div class="side-nav-divider"></div>
        <a href="#" class="side-nav-item" data-category="bracelets">Браслеты</a>
        <a href="#" class="side-nav-item" data-category="earrings">Серьги</a>
      </div>
    </div>

  </div>

  <script>
    const bodyEl=document.getElementById('bodyElement'),loginCard=document.getElementById('loginCard'),loginPage=document.getElementById('loginPage'),examplePage=document.getElementById('examplePage'),heroText=document.getElementById('heroText'),exampleContainer=document.getElementById('exampleContainer'),goToExampleBtn=document.getElementById('goToExampleBtn'),form=document.getElementById('clientForm'),phoneInput=document.getElementById('phone'),exampleBtnText=document.getElementById('exampleBtnText'),burgerBtn=document.getElementById('burgerBtn'),sidePanel=document.getElementById('sidePanel'),overlay=document.getElementById('overlay');
    let isFormSubmitted=false,animationTimeout=null,currentLang='rus',isMenuOpen=false;

    const t={uzb:{title:'Kirish',subhead:'xush kelibsiz',labelFirstname:'Ism',labelLastname:'Familiya',labelPhone:'Telefon raqami',submitBtn:'Ma\'lumotni yuborish',exampleBtnLocked:'🔒 Namunaga o\'tish',exampleBtnActive:'Namunaga o\'tish',heroTitle:'Namuna sahifa',heroSubtitle:'Xush kelibsiz!',alertFillAll:'Iltimos, barcha maydonlarni to\'ldiring.',alertThanks:(f,l,p)=>`Rahmat, ${f} ${l}!\nSizning raqamingiz: ${p}`,alertNeedSubmit:'Avval formani to\'ldiring va yuboring.'},rus:{title:'Вход',subhead:'добро пожаловать',labelFirstname:'Имя',labelLastname:'Фамилия',labelPhone:'Номер телефона',submitBtn:'Отправить информацию',exampleBtnLocked:'🔒 Перейти в примерную',exampleBtnActive:'Перейти в примерную',heroTitle:'Примерная страница',heroSubtitle:'Добро пожаловать!',alertFillAll:'Пожалуйста, заполните все поля.',alertThanks:(f,l,p)=>`Спасибо, ${f} ${l}!\nВаш номер: ${p}`,alertNeedSubmit:'Сначала заполните и отправьте форму.'},eng:{title:'Login',subhead:'welcome',labelFirstname:'First Name',labelLastname:'Last Name',labelPhone:'Phone Number',submitBtn:'Submit Information',exampleBtnLocked:'🔒 Go to Example',exampleBtnActive:'Go to Example',heroTitle:'Example Page',heroSubtitle:'Welcome!',alertFillAll:'Please fill in all fields.',alertThanks:(f,l,p)=>`Thank you, ${f} ${l}!\nYour number: ${p}`,alertNeedSubmit:'Please fill in and submit the form first.'}};

    function setLang(l){currentLang=l;const o=t[l];document.getElementById('pageTitle').textContent=o.title;document.getElementById('pageSubhead').textContent=o.subhead;document.getElementById('labelFirstname').textContent=o.labelFirstname;document.getElementById('labelLastname').textContent=o.labelLastname;document.getElementById('labelPhone').textContent=o.labelPhone;document.getElementById('submitBtn').textContent=o.submitBtn;document.getElementById('heroTitle').textContent=o.heroTitle;document.getElementById('heroSubtitle').textContent=o.heroSubtitle;if(isFormSubmitted)exampleBtnText.textContent=o.exampleBtnActive;else goToExampleBtn.innerHTML='<span class="lock-icon">🔒</span> '+o.exampleBtnLocked.replace('🔒 ','');document.querySelectorAll('.lang-dropdown-option').forEach(b=>{b.classList.remove('active');if(b.dataset.lang===l)b.classList.add('active');});document.getElementById('langLabelLogin').textContent=l.toUpperCase();}

    document.getElementById('langTriggerLogin').addEventListener('click',function(e){e.stopPropagation();document.getElementById('langDropdownLogin').classList.toggle('open');});
    document.querySelectorAll('#langMenuLogin .lang-dropdown-option').forEach(o=>{o.addEventListener('click',function(){setLang(this.dataset.lang);document.getElementById('langDropdownLogin').classList.remove('open');});});
    document.addEventListener('click',()=>{document.getElementById('langDropdownLogin').classList.remove('open');});

    function openMenu(){isMenuOpen=true;sidePanel.classList.add('open');overlay.classList.add('visible');burgerBtn.classList.add('open');}
    function closeMenu(){isMenuOpen=false;sidePanel.classList.remove('open');overlay.classList.remove('visible');burgerBtn.classList.remove('open');}
    burgerBtn.addEventListener('click',()=>isMenuOpen?closeMenu():openMenu());
    overlay.addEventListener('click',closeMenu);

    document.querySelectorAll('.nav-item-desktop, .side-nav-item').forEach(item=>{item.addEventListener('click',function(e){e.preventDefault();const list=this.closest('.nav-list-desktop, .side-nav-list');list.querySelectorAll('.nav-item-desktop, .side-nav-item').forEach(el=>el.classList.remove('active'));this.classList.add('active');if(this.closest('.side-panel'))setTimeout(closeMenu,300);});});

    document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(isMenuOpen)closeMenu();else if(!examplePage.classList.contains('hidden'))showLogin();}});

    function showExample(){
      loginPage.classList.add('hidden');loginCard.style.display='none';examplePage.classList.remove('hidden');bodyEl.classList.add('fullscreen');bodyEl.style.padding='0';
      heroText.classList.remove('moved');heroText.style.opacity='1';exampleContainer.classList.remove('visible');burgerBtn.style.display='none';closeMenu();setLang(currentLang);
      animationTimeout=setTimeout(()=>{heroText.classList.add('moved');setTimeout(()=>{exampleContainer.classList.add('visible');if(window.innerWidth<=768)burgerBtn.style.display='flex';},600);},1000);
    }

    function showLogin(){
      if(animationTimeout)clearTimeout(animationTimeout);closeMenu();heroText.classList.remove('moved');heroText.style.opacity='1';exampleContainer.classList.remove('visible');burgerBtn.style.display='none';
      examplePage.classList.add('hidden');loginPage.classList.remove('hidden');loginCard.style.display='flex';bodyEl.classList.remove('fullscreen');bodyEl.style.padding='';deactivate();form.reset();
    }

    function activate(){isFormSubmitted=true;goToExampleBtn.disabled=false;goToExampleBtn.classList.add('active');exampleBtnText.textContent=t[currentLang].exampleBtnActive;}
    function deactivate(){isFormSubmitted=false;goToExampleBtn.disabled=true;goToExampleBtn.classList.remove('active');goToExampleBtn.innerHTML='<span class="lock-icon">🔒</span> '+t[currentLang].exampleBtnLocked.replace('🔒 ','');}

    form.addEventListener('submit',function(e){e.preventDefault();const f=document.getElementById('firstname').value.trim(),l=document.getElementById('lastname').value.trim(),p=phoneInput.value.trim(),o=t[currentLang];if(!f||!l||!p){alert(o.alertFillAll);return;}activate();alert(o.alertThanks(f,l,p));});
    goToExampleBtn.addEventListener('click',function(){if(!isFormSubmitted){alert(t[currentLang].alertNeedSubmit);return;}showExample();});
    document.querySelectorAll('#clientForm input').forEach(i=>{i.addEventListener('input',()=>{if(isFormSubmitted)deactivate();});});
    phoneInput.addEventListener('input',function(){let v=this.value.replace(/[^\d+]/g,'');if(!v.startsWith('+')&&v.startsWith('998'))v='+'+v;this.value=v;});
  </script>
</body>
</html>
